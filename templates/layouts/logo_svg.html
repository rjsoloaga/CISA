<svg class="cisa-logo {{ class|default:'nav-logo' }}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" style="max-height: 100%;">
  <defs>
    <!-- Sunrise gradient for the sun -->
    <linearGradient id="sunriseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8b65" />
      <stop offset="60%" stop-color="#ff5b7f" />
      <stop offset="100%" stop-color="#231225" />
    </linearGradient>
    
    <!-- Dough gradient -->
    <linearGradient id="doughGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f9" />
      <stop offset="100%" stop-color="#ffe1e7" />
    </linearGradient>

    <!-- Translucent face gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 139, 101, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 91, 127, 0.4)" />
    </linearGradient>
    
    <!-- Blur filter for blurred faces -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <blur x="-20%" y="-20%" width="140%" height="140%" stdDeviation="6" />
    </filter>
  </defs>

  <style>
    .cisa-logo.nav-logo {
      width: 42px;
      height: 42px;
    }
    .cisa-logo.hero-logo {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      display: block;
    }
    .logo-sun {
      fill: url(#sunriseGrad);
    }
    .logo-face {
      fill: url(#faceGrad);
      filter: url(#softBlur);
    }
    .logo-dough {
      fill: url(#doughGrad);
      stroke: rgba(255, 91, 127, 0.25);
      stroke-width: 1.5;
    }
    .logo-hand-left {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .logo-hand-right {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- Background Sun (Sunrise) -->
  <circle class="logo-sun animate-glow" cx="100" cy="100" r="85" />

  <!-- Blurred faces representing community (No religious icons) -->
  <g class="community-faces">
    <!-- Left face shape -->
    <path class="logo-face" d="M 65 85 C 65 70, 75 60, 85 60 C 95 60, 95 75, 90 85 C 85 95, 70 95, 65 85 Z" />
    <!-- Right face shape -->
    <path class="logo-face" d="M 135 85 C 135 70, 125 60, 115 60 C 105 60, 105 75, 110 85 C 115 95, 130 95, 135 85 Z" />
    <!-- Center top face shape -->
    <path class="logo-face" d="M 100 65 C 100 52, 110 42, 120 42 C 130 42, 130 55, 125 65 C 120 75, 105 75, 100 65 Z" />
  </g>

  <!-- Dough in the center (Amasando) -->
  <path class="logo-dough animate-knead" d="M 60 145 C 50 120, 80 110, 100 112 C 120 110, 150 120, 140 145 C 130 160, 70 160, 60 145 Z" />

  <!-- Left Hand kneading/working -->
  <path class="logo-hand-left animate-hand-left" d="M 35 150 C 45 140, 60 132, 75 132 M 50 133 C 58 128, 70 126, 82 128 M 48 122 C 58 116, 72 118, 80 122 M 52 112 C 60 108, 72 110, 78 116 M 68 108 C 74 112, 78 118, 80 125" />

  <!-- Right Hand kneading/working -->
  <path class="logo-hand-right animate-hand-right" d="M 165 150 C 155 140, 140 132, 125 132 M 150 133 C 142 128, 130 126, 118 128 M 152 122 C 142 116, 128 118, 120 122 M 148 112 C 140 108, 128 110, 122 116 M 132 108 C 126 112, 122 118, 120 125" />
</svg>
