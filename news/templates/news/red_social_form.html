{% extends 'layouts/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 overflow-hidden" style="border-radius: 12px;">
                <div class="p-4 text-white" style="background-color: var(--dark-navy, #18314f);">
                    <h4 class="mb-1 fw-bold text-white"><i class="bi bi-share-fill me-2"></i> {{ accion }} Red Social</h4>
                    <p class="mb-0 text-white-50 small">Configure el enlace y el ícono correspondiente</p>
                </div>
                
                <div class="card-body p-4 p-md-5 bg-white">
                    <form method="post" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">Nombre de la Plataforma:</label>
                            {{ form.nombre }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">Enlace URL:</label>
                            {{ form.url }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">Ícono:</label>
                            {{ form.icono }}
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Orden de Visualización:</label>
                            {{ form.orden }}
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a href="{% url 'news:contacto' %}" class="btn btn-secondary px-3">Cancelar</a>
                            <button type="submit" class="btn text-white px-4 fw-semibold" style="background-color: var(--secondary-blue, #228be6);">
                                Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
