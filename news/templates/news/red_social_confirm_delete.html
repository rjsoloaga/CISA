{% extends 'layouts/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 overflow-hidden" style="border-radius: 12px;">
                <div class="p-4 bg-danger text-white">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i> Confirmar Eliminación</h5>
                </div>
                <div class="card-body p-4 bg-white">
                    <p class="text-dark mb-4">
                        ¿Estás seguro de que deseas eliminar la red social <strong>{{ red.nombre }}</strong>?
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'news:contacto' %}" class="btn btn-secondary px-3">Cancelar</a>
                            <button type="submit" class="btn btn-danger px-4">Eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
