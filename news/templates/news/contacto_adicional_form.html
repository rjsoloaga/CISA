{% extends 'layouts/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 overflow-hidden" style="border-radius: 12px;">
                <div class="p-4 text-white" style="background-color: var(--dark-navy, #18314f);">
                    <h4 class="mb-1 fw-bold text-white">{{ accion }} Campo Personalizado</h4>
                    <p class="mb-0 text-white-50 small">Define una etiqueta y su correspondiente información</p>
                </div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">{{ form.etiqueta.label }}</label>
                            {{ form.etiqueta }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">{{ form.valor.label }}</label>
                            {{ form.valor }}
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-dark">{{ form.tipo.label }}</label>
                                {{ form.tipo }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-dark">{{ form.icono.label }}</label>
                                {{ form.icono }}
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">{{ form.orden.label }}</label>
                            {{ form.orden }}
                        </div>
                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a href="{% url 'news:contacto' %}" class="btn btn-secondary px-3">Cancelar</a>
                            <button type="submit" class="btn text-white px-4 fw-semibold" style="background-color: var(--secondary-blue, #228be6);">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
