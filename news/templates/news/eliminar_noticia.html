{% extends 'layouts/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5 fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom border-danger">
            <div class="card-custom-header bg-danger text-white text-center p-4">
                <h3 class="mb-0 font-serif">¿Eliminar Noticia?</h3>
                <p class="mb-0 text-white-50 small mt-1">Esta acción no se puede deshacer</p>
            </div>
            
            <div class="card-body p-4 p-md-5 text-center">
                <div class="fs-1 mb-3">⚠️</div>
                <p class="fs-6 text-secondary mb-4">
                    ¿Estás seguro de que deseas eliminar permanentemente la noticia titulada:<br>
                    <strong class="text-dark">"{{ noticia.titulo }}"</strong>?
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-2.5 rounded-pill fw-bold shadow-sm">
                            Sí, Eliminar Definitivamente
                        </button>
                        <a href="{% url 'news:home' %}" class="btn btn-outline-secondary rounded-pill py-2 mt-2">
                            Cancelar y Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
