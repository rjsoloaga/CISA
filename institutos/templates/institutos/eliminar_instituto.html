{% extends 'layouts/base.html' %}
{% load static %}


{% block content %}
    <h1>Eliminar Instituto</h1>
    <p>Esta seguro que desa eliminar difinitivamente este instituto?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white;">Sí, Confirmar Eliminación</button>
        <br>
        <a href="{% url 'institutos:listar' %}">Cancelar y Volver</a>
    </form>
{% endblock %}
